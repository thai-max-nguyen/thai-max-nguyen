<svg xmlns="http://www.w3.org/2000/svg" width="592" height="304" viewBox="0 0 592 304" role="img" aria-labelledby="t d"><title id="t">Growth is stuck at the credit gate</title><desc id="d">~60% of active credit accounts never drew their limit; ~70% of failed auto-debits hit an empty wallet. Funnel diagnosis · 2026.</desc><style>@font-face{font-family:TNMono5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNDisplay;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNBody;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNMono;src:url(data:font/woff2;base64,) format('woff2')}</style><clipPath id="cl"><rect x="2" y="2" width="582" height="294" rx="16"/></clipPath><rect x="8" y="8" width="582" height="294" rx="16" fill="#010309" opacity="1"/><rect x="2" y="2" width="582" height="294" rx="16" fill="#191f2b"/><rect x="2" y="2" width="10" height="294" fill="#FFB84D" clip-path="url(#cl)"/><rect x="2" y="2" width="582" height="294" rx="16" fill="none" stroke="#3d434d" stroke-width="2"/><rect x="40" y="34" width="56" height="28" rx="14" fill="#FFB84D"/><text x="68" y="53" font-family="TNMono5" font-size="13" fill="#111620" text-anchor="middle" letter-spacing="1">TL5</text><text x="112" y="53" font-family="TNMono5" font-size="13" fill="#c8c3bc" letter-spacing="2">INSIGHT</text><text x="40" y="120" font-family="TNDisplay" font-size="26" fill="#f2eee6" letter-spacing="-0.6">Growth is stuck at the credit gate</text><text x="40" y="160" font-family="TNBody" font-size="18" fill="#c8c3bc">~60% of active credit accounts never</text><text x="40" y="188" font-family="TNBody" font-size="18" fill="#c8c3bc">drew their limit; ~70% of failed</text><text x="40" y="216" font-family="TNBody" font-size="18" fill="#c8c3bc">auto-debits hit an empty wallet.</text><path d="M40 240 H552" stroke="#3d434d" stroke-dasharray="4 5"/><text x="40" y="272" font-family="TNMono" font-size="14" fill="#a29e96">Funnel diagnosis · 2026</text></