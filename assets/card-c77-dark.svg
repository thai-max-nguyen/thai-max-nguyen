<svg xmlns="http://www.w3.org/2000/svg" width="592" height="274" viewBox="0 0 592 274" role="img" aria-labelledby="t d"><title id="t">Compliance without a new build</title><desc id="d">Showed certified liveness (ISO 30107-3 PAD L2/L3) met Circular 77. The bank agreed: a planned FIDO build was cut. TL4 · Face Authen · 2026.</desc><style>@font-face{font-family:TNMono5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNMono;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNDisplay;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNBody;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="2" y="2" width="582" height="264" rx="18" transform="translate(6 6)" fill="#010309" opacity="1"/><rect x="2" y="2" width="582" height="264" rx="18" fill="#191f2b" stroke="#3d434d" stroke-width="2"/><rect x="34" y="30" width="112.0" height="28" rx="14" fill="#113433"/><text x="90.0" y="49" font-family="TNMono5" font-size="13" fill="#52bfb9" text-anchor="middle" letter-spacing="1.5">REGULATION</text><text x="548" y="52" font-family="TNMono" font-size="14" fill="#a29e96" text-anchor="end">Zalopay User Core</text><text x="34" y="104" font-family="TNDisplay" font-size="28" fill="#f2eee6" letter-spacing="-0.6">Compliance without a new build</text><text x="34" y="142" font-family="TNBody" font-size="18" fill="#c8c3bc">Showed certified liveness (ISO 30107-3</text><text x="34" y="169" font-family="TNBody" font-size="18" fill="#c8c3bc">PAD L2/L3) met Circular 77. The bank</text><text x="34" y="196" font-family="TNBody" font-size="18" fill="#c8c3bc">agreed: a planned FIDO build was cut.</text><path d="M34 220 H548" stroke="#3d434d" stroke-dasharray="4 5"/><text x="34" y="248" font-family="TNMono" font-size="14" fill="#a29e96">TL4 · Face Authen · 2026</text></svg>