<svg xmlns="http://www.w3.org/2000/svg" width="592" height="304" viewBox="0 0 592 304" role="img" aria-labelledby="t d"><title id="t">Compliance without a new build</title><desc id="d">Showed certified liveness (ISO 30107-3 PAD L2/L3) met Circular 77. The bank agreed: a planned FIDO build was cut. Face Authen · 2026.</desc><style>@font-face{font-family:TNMono5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNDisplay;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNBody;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNMono;src:url(data:font/woff2;base64,) format('woff2')}</style><clipPath id="cl"><rect x="2" y="2" width="582" height="294" rx="16"/></clipPath><rect x="8" y="8" width="582" height="294" rx="16" fill="#192334" opacity="0.9"/><rect x="2" y="2" width="582" height="294" rx="16" fill="#fdfbf6"/><rect x="2" y="2" width="10" height="294" fill="#9900AA" clip-path="url(#cl)"/><rect x="2" y="2" width="582" height="294" rx="16" fill="none" stroke="#192334" stroke-width="2"/><circle cx="47" cy="48" r="7" fill="#9900AA"/><text x="64" y="53" font-family="TNMono5" font-size="13" fill="#454d5d" letter-spacing="2">REGULATION</text><text x="40" y="120" font-family="TNDisplay" font-size="26" fill="#192334" letter-spacing="-0.6">Compliance without a new build</text><text x="40" y="160" font-family="TNBody" font-size="18" fill="#454d5d">Showed certified liveness (ISO 30107-3</text><text x="40" y="188" font-family="TNBody" font-size="18" fill="#454d5d">PAD L2/L3) met Circular 77. The bank</text><text x="40" y="216" font-family="TNBody" font-size="18" fill="#454d5d">agreed: a planned FIDO build was cut.</text><path d="M40 240 H552" stroke="#b8bec8" stroke-dasharray="4 5"/><text x="40" y="272" font-family="TNMono" font-size="14" fill="#5d646f">Face Authen · 2026</text></svg>