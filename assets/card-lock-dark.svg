<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="t d"><title id="t">When the phone is stolen, the wallet should not be</title><desc id="d">After a viral stolen-phone case, mapped five break points and scoped two fixes: a new-device warning that shows risky bindings, and a self-serve Lock Account from the login screen, verified by face, not SMS. TL4 · trust &amp; safety · Face Authen replaces SMS OTP.</desc><style>@font-face{font-family:TNMono5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNMono;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNDisplay;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNBody;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="2" y="2" width="1190" height="226" rx="18" transform="translate(6 6)" fill="#010309" opacity="1"/><rect x="2" y="2" width="1190" height="226" rx="18" fill="#191f2b" stroke="#3d434d" stroke-width="2"/><rect x="34" y="30" width="95.2" height="28" rx="14" fill="#113433"/><text x="81.6" y="49" font-family="TNMono5" font-size="13" fill="#52bfb9" text-anchor="middle" letter-spacing="1.5">IN BUILD</text><text x="1156" y="52" font-family="TNMono" font-size="14" fill="#a29e96" text-anchor="end">Zalopay User Core</text><text x="34" y="104" font-family="TNDisplay" font-size="32" fill="#f2eee6" letter-spacing="-0.6">When the phone is stolen, the wallet should not be</text><text x="34" y="142" font-family="TNBody" font-size="18" fill="#c8c3bc">After a viral stolen-phone case, mapped five break points and scoped two fixes: a new-device warning that</text><text x="34" y="169" font-family="TNBody" font-size="18" fill="#c8c3bc">shows risky bindings, and a self-serve Lock Account from the login screen, verified by face, not SMS.</text><path d="M34 182 H1156" stroke="#3d434d" stroke-dasharray="4 5"/><text x="34" y="210" font-family="TNMono" font-size="14" fill="#a29e96">TL4 · trust &amp; safety · Face Authen replaces SMS OTP</text></svg>