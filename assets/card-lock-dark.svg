<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d"><title id="t">When the phone is stolen, the wallet should not be</title><desc id="d">After a viral stolen-phone case, mapped five break points and scoped two fixes: a new-device warning that shows risky bindings, and a self-serve Lock Account from the login screen, verified by face, not SMS. Trust &amp; safety · Face Authen replaces SMS OTP.</desc><style>@font-face{font-family:TNMono5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNDisplay;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNBody;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNMono;src:url(data:font/woff2;base64,) format('woff2')}</style><clipPath id="cl"><rect x="2" y="2" width="1190" height="270" rx="16"/></clipPath><rect x="8" y="8" width="1190" height="270" rx="16" fill="#010309" opacity="1"/><rect x="2" y="2" width="1190" height="270" rx="16" fill="#191f2b"/><rect x="2" y="2" width="10" height="270" fill="#D77BE6" clip-path="url(#cl)"/><rect x="2" y="2" width="1190" height="270" rx="16" fill="none" stroke="#3d434d" stroke-width="2"/><rect x="40" y="34" width="56" height="28" rx="14" fill="#D77BE6"/><text x="68" y="53" font-family="TNMono5" font-size="13" fill="#111620" text-anchor="middle" letter-spacing="1">TL4</text><text x="112" y="53" font-family="TNMono5" font-size="13" fill="#c8c3bc" letter-spacing="2">IN BUILD</text><text x="40" y="120" font-family="TNDisplay" font-size="30" fill="#f2eee6" letter-spacing="-0.6">When the phone is stolen, the wallet should not be</text><text x="40" y="160" font-family="TNBody" font-size="18" fill="#c8c3bc">After a viral stolen-phone case, mapped five break points and scoped two fixes: a new-device warning that</text><text x="40" y="188" font-family="TNBody" font-size="18" fill="#c8c3bc">shows risky bindings, and a self-serve Lock Account from the login screen, verified by face, not SMS.</text><path d="M40 216 H1160" stroke="#3d434d" stroke-dasharray="4 5"/><text x="40" y="248" font-family="TNMono" font-size="14" fill="#a29e96">Trust &amp; safety · Face Authen replaces SMS OTP</text></svg>