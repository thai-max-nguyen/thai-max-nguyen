<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d"><title id="t">Zalopay inside Apple services</title><desc id="d">Product lead for Zalopay as a payment method on the App Store, Apple Music and Apple TV: 51% of linked users went on to pay. A web flow for people without the app brings ~40% of new payers. Also Apple Hub. Global merchants · launched 2025.</desc><style>@font-face{font-family:TNMono5;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNDisplay;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNBody;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TNMono;src:url(data:font/woff2;base64,) format('woff2')}</style><clipPath id="cl"><rect x="2" y="2" width="1190" height="270" rx="16"/></clipPath><rect x="8" y="8" width="1190" height="270" rx="16" fill="#010309" opacity="1"/><rect x="2" y="2" width="1190" height="270" rx="16" fill="#191f2b"/><rect x="2" y="2" width="10" height="270" fill="#FF7A66" clip-path="url(#cl)"/><rect x="2" y="2" width="1190" height="270" rx="16" fill="none" stroke="#3d434d" stroke-width="2"/><circle cx="47" cy="48" r="7" fill="#FF7A66"/><text x="64" y="53" font-family="TNMono5" font-size="13" fill="#c8c3bc" letter-spacing="2">SHIPPED</text><rect x="985.6" y="28" width="174.4" height="40" rx="10" fill="#ffffff" stroke="#3d434d" stroke-width="1.5"/><image href="data:image/svg+xml;base64," x="997.6" y="37.0" width="98.2" height="22.0" preserveAspectRatio="xMidYMid meet"/><path d="M1109.8 40 V56" stroke="#c9ced6" stroke-width="1.5"/><image href="data:image/svg+xml;base64," x="1123.8" y="35.9" width="24.2" height="24.2" preserveAspectRatio="xMidYMid meet"/><text x="40" y="120" font-family="TNDisplay" font-size="30" fill="#f2eee6" letter-spacing="-0.6">Zalopay inside Apple services</text><text x="40" y="160" font-family="TNBody" font-size="18" fill="#c8c3bc">Product lead for Zalopay as a payment method on the App Store, Apple Music and Apple TV: 51% of linked</text><text x="40" y="188" font-family="TNBody" font-size="18" fill="#c8c3bc">users went on to pay. A web flow for people without the app brings ~40% of new payers. Also Apple Hub.</text><path d="M40 216 H1160" stroke="#3d434d" stroke-dasharray="4 5"/><text x="40" y="248" font-family="TNMono" font-size="14" fill="#a29e96">Global merchants · launched 2025</text><text x="1160" y="248" font-family="TNMono5" font-size="14" fill="#FF7A66" text-anchor="end">launch post ↗</text></svg>